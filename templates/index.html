<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPX 50K</title>
<style>
:root{--bg:#090d14;--card:#121925;--line:#202a38;--txt:#f6f8fc;--muted:#8f9bad;--call:#37d67a;--put:#ff5d79;--gold:#f5c84c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:720px;margin:auto;padding:14px 12px 40px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:13px;color:var(--muted);font-weight:800}
.live{font-size:12px;color:var(--gold)}
.price{font-size:42px;font-weight:900;margin-top:7px;direction:ltr;text-align:right}
.change{font-size:14px;font-weight:800;direction:ltr;text-align:right;margin-top:2px}
.meta{font-size:12px;color:var(--muted);margin-top:9px}
.block{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.block h2{margin:0;padding:14px 15px;border-bottom:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;align-items:center}
.call h2 .side{color:var(--call)} .put h2 .side{color:var(--put)}
.head,.row{display:grid;grid-template-columns:1.1fr 1fr 1.25fr 1fr;gap:6px;align-items:center;padding:12px 10px}
.head{font-size:11px;color:var(--muted);background:rgba(255,255,255,.02)}
.row{border-top:1px solid var(--line);font-size:14px}
.num{text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.strike{font-size:16px;font-weight:900}
.vol{font-weight:900}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}
.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:14px;line-height:1.6}
.error{margin-top:12px;padding:12px;border-radius:14px;background:#35151d;color:#ffc7d1}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="top">
      <div class="tag">SPX · 0DTE · VOLUME ≥ 50K</div>
      <div class="live">DELAYED DATA</div>
    </div>
    <div id="price" class="price">—</div>
    <div id="change" class="change">—</div>
    <div id="meta" class="meta">جاري التحميل...</div>
  </section>

  <section class="block call">
    <h2><span class="side">CALLS</span><span>50K+</span></h2>
    <div class="head"><div class="num">Strike</div><div class="num">السعر</div><div class="num">Volume</div><div class="num">OI</div></div>
    <div id="calls"></div>
  </section>

  <section class="block put">
    <h2><span class="side">PUTS</span><span>50K+</span></h2>
    <div class="head"><div class="num">Strike</div><div class="num">السعر</div><div class="num">Volume</div><div class="num">OI</div></div>
    <div id="puts"></div>
  </section>

  <div id="error"></div>
  <div class="foot">تحديث تلقائي كل 60 ثانية · البيانات المجانية قد تكون متأخرة وليست OPRA Real-Time</div>
</div>

<script>
const fmt=(v,d=2)=>{if(v===null||v===undefined||Number.isNaN(Number(v))) return "—";return Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});};
const fmtInt=v=>{if(v===null||v===undefined) return "—";return Number(v).toLocaleString("en-US",{maximumFractionDigits:0});};
function render(items){
  if(!items||!items.length) return '<div class="empty">لا يوجد عقد وصل 50K حاليًا</div>';
  return items.map(x=>`<div class="row"><div class="num strike">${fmt(x.strike,0)}</div><div class="num">$${fmt(x.price,2)}</div><div class="num vol">${fmtInt(x.volume)}</div><div class="num">${fmtInt(x.open_interest)}</div></div>`).join("");
}
async function refresh(){
  const err=document.getElementById("error");
  try{
    const r=await fetch("/api/dashboard",{cache:"no-store"});
    const d=await r.json();
    if(!d.ok) throw new Error(d.error||"تعذر جلب البيانات");
    document.getElementById("price").textContent=fmt(d.spx_price,2);
    const ch=Number(d.change||0), pct=Number(d.change_pct||0);
    const ce=document.getElementById("change");
    ce.textContent=`${ch>=0?"+":""}${fmt(ch,2)} (${pct>=0?"+":""}${fmt(pct,2)}%)`;
    ce.style.color=ch>=0?"#37d67a":"#ff5d79";
    const t=d.market_time?new Date(d.market_time):new Date();
    const tt=t.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit",timeZone:"America/New_York"});
    document.getElementById("meta").textContent=d.expiration?`Expiration ${d.expiration} · New York ${tt}`:`${d.message||""} · New York ${tt}`;
    document.getElementById("calls").innerHTML=render(d.calls);
    document.getElementById("puts").innerHTML=render(d.puts);
    err.innerHTML="";
  }catch(e){err.innerHTML=`<div class="error">${e.message}</div>`;}
}
refresh();
setInterval(refresh,60000);
</script>
</body>
</html>
